name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: go test -race
        run: go test ./... -race -count=1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o bin/ctxline-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/ctxline
      - uses: actions/upload-artifact@v4
        with:
          name: ctxline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/ctxline-${{ matrix.goos }}-${{ matrix.goarch }}
