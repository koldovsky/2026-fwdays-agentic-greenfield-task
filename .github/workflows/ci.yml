name: CI

# Quality guardrails for every change (PRs into main + pushes to main), plus the off-box image
# build → GHCR on pushes to main — see docs/adr/0006-build-off-box-ghcr.md. Coolify only pulls.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Format · Docs · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Docs sync
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Key-less eval ratchet (ADR-0013) — compares committed scores, makes no LLM call. Skips
      # gracefully until the first local `npm run evals` produces results/latest.json.
      - name: Eval ratchet
        run: npm run check:evals

      # Whole-program static analysis (ADR-0011) — dead-code, duplication, complexity hotspots
      # that per-file ESLint can't see. REPORT-ONLY per the ADR graduation path: surfaces
      # findings without failing the PR. Promote to blocking (drop continue-on-error) once the
      # baseline is clean — the same path ESLint took.
      - name: Static analysis (Fallow · report-only)
        run: npx --yes fallow --ci
        continue-on-error: true

  # Off-box build → GHCR. Local gates are authoritative (ADR-0012); this is the one signal local
  # can't reproduce. The image is BUILT on every CI run (so a broken Dockerfile fails the PR, not
  # post-merge) but PUSHED to GHCR only on `main`. Coolify pulls the pushed image.
  image:
    name: Build image (push to GHCR on main)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
