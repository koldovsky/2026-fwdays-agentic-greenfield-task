context: |
  Tech stack: .NET 10, C#, .NET MAUI, xUnit, ONNX Runtime, SkiaSharp.
  Domain: offline traffic-sign object detection using an Azure Custom Vision compact ONNX export.
  Requirements source: docs/requirements.md.
  Model contract source: docs/model-contract.md.
  Core must stay UI-free and must not reference Microsoft.Maui.*.
  Preprocessing must use center-crop, resize to 320x320, NCHW, and raw RGB 0..255 tensor values.
  Detection must run without network calls.

