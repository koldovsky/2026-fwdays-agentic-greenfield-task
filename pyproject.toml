[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-expense-tracker"
version = "0.1.0"
description = "A Telegram-based expense tracker using LLM-powered parsing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "v.liashenko"}]

dependencies = [
    "python-telegram-bot>=20.0",
    "openai>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-psycopg2>=2.9.0",
    "types-python-dateutil>=2.8.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "live_api: tests that call live OpenAI API (use -m 'not live_api' to skip)",
]
