<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:22px;background:var(--surface-page)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Switch, Checkbox } = window.BookshelfDesignSystem_18192e;
function Demo(){
  React.useEffect(()=>{ lucide.createIcons(); });
  return (<div className="grid">
    <div className="stack">
      <Input label="Title" placeholder="Book title…" defaultValue="The Human Condition" />
      <Input iconLeft={<i data-lucide="search" style={{width:15,height:15}}></i>} placeholder="Search your shelf" />
      <Select label="Sort by" options={['Recently read','Highest rated','Title A–Z']} />
    </div>
    <div className="stack">
      <Textarea label="Note" ruled rows={3} defaultValue="Attention is the rarest and purest form of generosity." />
      <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:2}}>
        <Switch label="Dark mode" defaultChecked />
        <Checkbox label="Finished" defaultChecked />
        <Checkbox label="Include re-reads" />
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
