<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Warm paper" subtitle="A warm, ledger-paper grey ramp from white to near-black ink" -->
<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); height: 64px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; border: 1px solid var(--border-subtle); }
  .lbl { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
  .cap { font-size: 11px; color: var(--text-muted); letter-spacing: var(--tracking-label); text-transform: uppercase; font-weight: 600; margin: 0 0 8px; }
</style>
</head>
<body>
  <p class="cap">Paper · warm neutral ink</p>
  <div class="row">
    <div class="sw" style="background:var(--paper-25)"><span class="lbl" style="color:#28251f">25</span></div>
    <div class="sw" style="background:var(--paper-50)"><span class="lbl" style="color:#28251f">50</span></div>
    <div class="sw" style="background:var(--paper-100)"><span class="lbl" style="color:#28251f">100</span></div>
    <div class="sw" style="background:var(--paper-200)"><span class="lbl" style="color:#28251f">200</span></div>
    <div class="sw" style="background:var(--paper-300)"><span class="lbl" style="color:#28251f">300</span></div>
    <div class="sw" style="background:var(--paper-400)"><span class="lbl" style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--paper-500)"><span class="lbl" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--paper-600)"><span class="lbl" style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--paper-700)"><span class="lbl" style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--paper-900)"><span class="lbl" style="color:#fff">900</span></div>
  </div>
</body>
</html>
