<!-- @dsCard group="Colors" viewport="700x172" name="Brand — Green & Brass" subtitle="Treasury-green primary ramp + muted brass accent" -->
<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 6px; margin-bottom: 12px; }
  .sw { flex: 1; border-radius: var(--radius-sm); height: 54px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; }
  .lbl { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
  .cap { font-size: 11px; color: var(--text-muted); letter-spacing: var(--tracking-label); text-transform: uppercase; font-weight: 600; margin: 0 0 8px; }
</style>
</head>
<body>
  <p class="cap">Green · primary (treasury)</p>
  <div class="row">
    <div class="sw" style="background:var(--green-50)"><span class="lbl" style="color:#142d22">50</span></div>
    <div class="sw" style="background:var(--green-100)"><span class="lbl" style="color:#142d22">100</span></div>
    <div class="sw" style="background:var(--green-300)"><span class="lbl" style="color:#142d22">300</span></div>
    <div class="sw" style="background:var(--green-500)"><span class="lbl" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--green-700)"><span class="lbl" style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--green-900)"><span class="lbl" style="color:#fff">900</span></div>
  </div>
  <p class="cap">Brass · accent (the coin, the ₴)</p>
  <div class="row" style="margin-bottom:0">
    <div class="sw" style="background:var(--brass-50)"><span class="lbl" style="color:#6e4f1f">50</span></div>
    <div class="sw" style="background:var(--brass-100)"><span class="lbl" style="color:#6e4f1f">100</span></div>
    <div class="sw" style="background:var(--brass-300)"><span class="lbl" style="color:#2a1f06">300</span></div>
    <div class="sw" style="background:var(--brass-400)"><span class="lbl" style="color:#2a1f06">400</span></div>
    <div class="sw" style="background:var(--brass-500)"><span class="lbl" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--brass-700)"><span class="lbl" style="color:#fff">700</span></div>
  </div>
</body>
</html>
