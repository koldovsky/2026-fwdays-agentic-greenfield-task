<!-- @dsCard group="Type" viewport="700x250" name="Type scale" subtitle="11 → 64px. Serif headings, mono for the hero rate" -->
<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface); font-family: var(--font-sans); color: var(--text); }
  .r { display: flex; align-items: baseline; gap: 14px; padding: 3px 0; }
  .sz { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 84px; flex: none; }
  .ex { font-family: var(--font-serif); font-weight: 600; line-height: 1.1; letter-spacing: -0.015em; }
</style>
</head>
<body>
  <div class="r"><span class="sz">4xl · 64 mono</span><span class="ex" style="font-family:var(--font-mono);font-size:46px">41,85</span></div>
  <div class="r"><span class="sz">2xl · 36</span><span class="ex" style="font-size:34px">Курс гривні</span></div>
  <div class="r"><span class="sz">xl · 28</span><span class="ex" style="font-size:26px">Конвертер</span></div>
  <div class="r"><span class="sz">lg · 22</span><span class="ex" style="font-size:20px">Історія курсу</span></div>
  <div class="r"><span class="sz">base · 16</span><span class="ex" style="font-family:var(--font-sans);font-weight:400;font-size:16px;color:var(--text-secondary)">Долар за тиждень зміцнів на 1,2%.</span></div>
  <div class="r"><span class="sz">2xs · 11</span><span class="ex" style="font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:0.09em;color:var(--text-muted)">СТАНОМ НА 29.06.2026</span></div>
</body>
</html>
