<!-- @dsCard group="Type" viewport="700x230" name="Families — Plex trio" subtitle="IBM Plex Serif (display) · Sans (UI) · Mono (numerals)" -->
<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface); font-family: var(--font-sans); }
  .block { margin-bottom: 16px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: var(--tracking-label); text-transform: uppercase; margin-bottom: 4px; }
  .serif { font-family: var(--font-serif); font-size: 30px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .sans { font-family: var(--font-sans); font-size: 17px; color: var(--text-secondary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; color: var(--text); }
</style>
</head>
<body>
  <div class="block">
    <div class="tag">Serif · display & headings</div>
    <div class="serif">Офіційний курс гривні</div>
  </div>
  <div class="block">
    <div class="tag">Sans · UI & body</div>
    <div class="sans">За тиждень долар майже без змін до гривні.</div>
  </div>
  <div class="block" style="margin-bottom:0">
    <div class="tag">Mono · усі числа, tabular</div>
    <div class="mono">41,85 ₴ &nbsp; 45,12 ₴ &nbsp; 1 308,40 ₴ &nbsp; +1,2%</div>
  </div>
</body>
</html>
