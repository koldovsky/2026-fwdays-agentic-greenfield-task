<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid · 4 → 80" -->
<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--brand); border-radius: var(--radius-xs); width: 22px; }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .cap { font-size: 11px; color: var(--text-muted); letter-spacing: var(--tracking-label); text-transform: uppercase; font-weight: 600; margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="cap">4px base grid</p>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><span class="n">1·4</span></div>
    <div class="col"><div class="bar" style="height:8px"></div><span class="n">2·8</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span class="n">3·12</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="n">4·16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="n">5·24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="n">6·32</span></div>
    <div class="col"><div class="bar" style="height:40px"></div><span class="n">7·40</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span class="n">8·48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="n">9·64</span></div>
    <div class="col"><div class="bar" style="height:80px"></div><span class="n">10·80</span></div>
  </div>
</body>
</html>
