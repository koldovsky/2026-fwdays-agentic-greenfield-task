<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Ink-blue" subtitle="Ballpoint blue: the one action color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-page)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:80px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-meta);font-size:11px;color:#fff}
  .sw:first-child{border-radius:10px 0 0 10px}.sw:last-child{border-radius:0 10px 10px 0}
  .lbl{display:flex;gap:0;margin-top:8px}
  .lbl span{flex:1;font-family:var(--font-meta);font-size:10px;color:var(--text-muted);text-align:center}
  .dark-note{font-family:var(--font-body);font-size:12px;color:var(--text-muted);margin-top:10px}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--blue-50);color:var(--ink-2)">50</div>
    <div class="sw" style="background:var(--blue-100);color:var(--ink-2)">100</div>
    <div class="sw" style="background:var(--blue-200);color:var(--ink-2)">200</div>
    <div class="sw" style="background:var(--blue-300)">300</div>
    <div class="sw" style="background:var(--blue-400)">400</div>
    <div class="sw" style="background:var(--blue-500)">500 ●</div>
    <div class="sw" style="background:var(--blue-600)">600</div>
    <div class="sw" style="background:var(--blue-700)">700</div>
    <div class="sw" style="background:var(--blue-800)">800</div>
    <div class="sw" style="background:var(--blue-900)">900</div>
  </div>
  <div class="dark-note">500 = primary action (<code>--accent</code>). 600 hover · 700 pressed. Soft tint 50 for selected rows &amp; chips.</div>
</body></html>
