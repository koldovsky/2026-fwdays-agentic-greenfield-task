<!-- @dsCard group="Type" viewport="700x250" name="Type scale" subtitle="xs → 5xl, role-mapped" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:16px 22px;background:var(--surface-page)}
  .r{display:flex;align-items:baseline;gap:14px;padding:3px 0;border-bottom:1px solid var(--border-subtle)}
  .r:last-child{border-bottom:0}
  .s{font-family:var(--font-display);color:var(--text-primary);line-height:1.1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t{font-family:var(--font-meta);font-size:10px;color:var(--text-muted);width:130px;text-align:right;flex-shrink:0}
</style></head>
<body>
  <div class="r"><div class="s" style="font-size:62px;font-weight:600">Bookshelf</div><div class="t">5xl · 62</div></div>
  <div class="r"><div class="s" style="font-size:38px;font-weight:600">Currently reading</div><div class="t">3xl · 38</div></div>
  <div class="r"><div class="s" style="font-size:24px;font-weight:500">Chapter notes</div><div class="t">xl · 24</div></div>
  <div class="r"><div class="s" style="font-size:17px;font-family:var(--font-body)">Reading body — 17px</div><div class="t">md · 17</div></div>
  <div class="r"><div class="s" style="font-size:15px;font-family:var(--font-body)">UI body — 15px</div><div class="t">base · 15</div></div>
  <div class="r"><div class="s" style="font-size:12px;font-family:var(--font-meta);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">Eyebrow label</div><div class="t">xs · 12</div></div>
</body></html>
