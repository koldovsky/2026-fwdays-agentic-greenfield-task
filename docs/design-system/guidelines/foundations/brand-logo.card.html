<!-- @dsCard group="Brand" viewport="700x200" name="Logo & wordmark" subtitle="Mark on light, dark, and brand grounds" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page)}
  .row{display:flex;gap:14px;align-items:stretch}
  .tile{flex:1;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:22px;min-height:96px}
  .cap{font-family:var(--font-meta);font-size:10px;color:var(--text-muted);margin-top:8px;text-align:center}
  .word{display:flex;align-items:center;gap:12px;margin-top:14px}
  .word .nm{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em}
</style></head>
<body>
  <div class="row">
    <div>
      <div class="tile" style="background:var(--paper-0);box-shadow:inset 0 0 0 1px var(--border-default)"><img src="../../assets/logo-mark.svg" width="56"></div>
      <div class="cap">on paper</div>
    </div>
    <div>
      <div class="tile" style="background:var(--ink-0)"><img src="../../assets/logo-mark.svg" width="56"></div>
      <div class="cap">on ink</div>
    </div>
    <div>
      <div class="tile" style="background:var(--blue-500)"><img src="../../assets/logo-mark.svg" width="56" style="filter:none"></div>
      <div class="cap">on brand</div>
    </div>
  </div>
  <div class="word"><img src="../../assets/logo-mark.svg" width="40"><span class="nm">Bookshelf</span></div>
</body></html>
