<!-- @dsCard group="Colors" viewport="700x190" name="Highlighter spectrum" subtitle="8 note colors — saturated ink + translucent marker" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
  .col{display:flex;flex-direction:column;gap:6px;align-items:center}
  .dot{width:34px;height:34px;border-radius:999px}
  .mark{font-family:var(--font-display);font-size:15px;color:var(--ink-0);padding:2px 5px;border-radius:4px}
  .name{font-family:var(--font-meta);font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div class="grid">
    <div class="col"><div class="dot" style="background:var(--hl-yellow)"></div><span class="mark" style="background:var(--hl-yellow-mark)">Aa</span><span class="name">yellow</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-amber)"></div><span class="mark" style="background:var(--hl-amber-mark)">Aa</span><span class="name">amber</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-coral)"></div><span class="mark" style="background:var(--hl-coral-mark)">Aa</span><span class="name">coral</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-pink)"></div><span class="mark" style="background:var(--hl-pink-mark)">Aa</span><span class="name">pink</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-purple)"></div><span class="mark" style="background:var(--hl-purple-mark)">Aa</span><span class="name">purple</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-blue)"></div><span class="mark" style="background:var(--hl-blue-mark)">Aa</span><span class="name">blue</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-teal)"></div><span class="mark" style="background:var(--hl-teal-mark)">Aa</span><span class="name">teal</span></div>
    <div class="col"><div class="dot" style="background:var(--hl-green)"></div><span class="mark" style="background:var(--hl-green-mark)">Aa</span><span class="name">green</span></div>
  </div>
</body></html>
