<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="4px base — 1 through 16" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px 22px;background:var(--surface-page);font-family:var(--font-meta)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .c{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--blue-300);border-radius:3px;width:18px}
  .n{font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="bar" style="height:4px"></div><div class="n">1·4</div></div>
    <div class="c"><div class="bar" style="height:8px"></div><div class="n">2·8</div></div>
    <div class="c"><div class="bar" style="height:12px"></div><div class="n">3·12</div></div>
    <div class="c"><div class="bar" style="height:16px"></div><div class="n">4·16</div></div>
    <div class="c"><div class="bar" style="height:20px"></div><div class="n">5·20</div></div>
    <div class="c"><div class="bar" style="height:24px"></div><div class="n">6·24</div></div>
    <div class="c"><div class="bar" style="height:32px"></div><div class="n">8·32</div></div>
    <div class="c"><div class="bar" style="height:40px"></div><div class="n">10·40</div></div>
    <div class="c"><div class="bar" style="height:48px"></div><div class="n">12·48</div></div>
    <div class="c"><div class="bar" style="height:64px"></div><div class="n">16·64</div></div>
  </div>
</body></html>
