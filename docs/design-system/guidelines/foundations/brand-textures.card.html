<!-- @dsCard group="Brand" viewport="700x160" name="Paper textures" subtitle="Notebook ruled lines & dot grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-page)}
  .row{display:flex;gap:14px}
  .t{flex:1;height:118px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border-default);position:relative;overflow:hidden}
  .cap{position:absolute;left:10px;bottom:8px;font-family:var(--font-meta);font-size:10px;color:var(--text-muted);background:var(--surface-card);padding:2px 6px;border-radius:6px}
</style></head>
<body>
  <div class="row">
    <div class="t" style="background:var(--paper-0) var(--texture-rule)"><span class="cap">--texture-rule · 32px</span></div>
    <div class="t" style="background:var(--paper-0) var(--texture-dot);background-size:18px 18px"><span class="cap">--texture-dot · 18px</span></div>
    <div class="t" style="background:var(--paper-1)"><span class="cap">--paper-1 · plain cream</span></div>
  </div>
</body></html>
