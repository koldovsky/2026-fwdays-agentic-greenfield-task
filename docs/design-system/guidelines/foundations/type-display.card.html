<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px 22px;background:var(--surface-page)}
  .d{font-family:var(--font-display);color:var(--text-primary);line-height:1.05;letter-spacing:-.02em}
  .meta{font-family:var(--font-meta);font-size:10px;color:var(--text-muted);margin-top:2px}
  .it{font-style:italic;color:var(--text-secondary)}
</style></head>
<body>
  <div class="d" style="font-size:48px;font-weight:600">The unread shelf</div>
  <div class="meta">Newsreader · 600 · 48px / -0.02em — page &amp; book titles</div>
  <div class="d" style="font-size:28px;font-weight:500;margin-top:14px">A room without books <span class="it">is a body without a soul</span></div>
  <div class="meta">Newsreader · 500 + italic · 28px — quotes &amp; pull-outs</div>
</body></html>
