<!-- @dsCard group="Spacing" viewport="700x150" name="Shadows" subtitle="Warm, low paper elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px 22px;background:var(--surface-page);font-family:var(--font-meta)}
  .row{display:flex;gap:26px;align-items:center}
  .c{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:78px;height:54px;background:var(--surface-card);border-radius:12px}
  .n{font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
    <div class="c"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
    <div class="c"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
    <div class="c"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
    <div class="c"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div></div>
  </div>
</body></html>
