<!-- @dsCard group="Colors" viewport="700x150" name="Paper & Ink neutrals" subtitle="Warm cream surfaces, warm near-black text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-meta);font-size:10px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:0}
  .sw{flex:1;height:46px;display:flex;align-items:flex-end;padding:6px}
  .row .sw:first-child{border-radius:8px 0 0 8px}.row .sw:last-child{border-radius:0 8px 8px 0}
  .tag{color:var(--text-muted);font-size:10px;margin-bottom:4px}
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="tag">PAPER · surfaces</div>
      <div class="row">
        <div class="sw" style="background:var(--paper-0);box-shadow:inset 0 0 0 1px var(--border-default);color:var(--ink-3)">0</div>
        <div class="sw" style="background:var(--paper-1);color:var(--ink-3)">1</div>
        <div class="sw" style="background:var(--paper-2);color:var(--ink-3)">2</div>
        <div class="sw" style="background:var(--paper-3);color:var(--ink-3)">3</div>
        <div class="sw" style="background:var(--paper-4);color:var(--ink-2)">4</div>
      </div>
    </div>
    <div>
      <div class="tag">INK · text &amp; lines</div>
      <div class="row">
        <div class="sw" style="background:var(--ink-0);color:#fff">0</div>
        <div class="sw" style="background:var(--ink-1);color:#fff">1</div>
        <div class="sw" style="background:var(--ink-2);color:#fff">2</div>
        <div class="sw" style="background:var(--ink-3);color:#fff">3</div>
        <div class="sw" style="background:var(--ink-4);color:#fff">4</div>
        <div class="sw" style="background:var(--ink-5);color:var(--ink-1)">5</div>
        <div class="sw" style="background:var(--ink-6);color:var(--ink-1)">6</div>
      </div>
    </div>
  </div>
</body></html>
