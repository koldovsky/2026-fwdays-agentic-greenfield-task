<!-- @dsCard group="Components" viewport="700x520" name="Core" subtitle="Button, IconButton, Card, Badge, DeviceCard" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--base-100);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, Badge, DeviceCard } = window.OrbitTVRemoteDesignSystem_08e5b7;

function Row({ children }) {
  return <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>{children}</div>;
}
function Section({ label, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--fg-3)', fontFamily: 'var(--font-sans)' }}>{label}</div>
      {children}
    </div>
  );
}

function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22, fontFamily: 'var(--font-sans)' }}>
      <Section label="Button">
        <Row>
          <Button variant="primary" icon="add">Add TV</Button>
          <Button variant="secondary">Cancel</Button>
          <Button variant="ghost" size="sm">Skip</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </Row>
      </Section>
      <Section label="IconButton">
        <Row>
          <IconButton icon="keyboard_arrow_up" />
          <IconButton icon="power_settings_new" tone="accent" size="lg" />
          <IconButton icon="volume_off" active />
          <IconButton icon="delete" tone="danger" />
        </Row>
      </Section>
      <Section label="Card">
        <Row>
          <Card style={{ width: 180, fontSize: 14 }}>Raised</Card>
          <Card variant="inset" style={{ width: 180, fontSize: 14 }}>Inset</Card>
        </Row>
      </Section>
      <Section label="Badge">
        <Row>
          <Badge status="online" />
          <Badge status="offline" />
          <Badge status="connecting" />
        </Row>
      </Section>
      <Section label="DeviceCard">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: 620 }}>
          <DeviceCard name="Living Room" model="OrbitCast X1" ip="192.168.1.42" status="online" />
          <DeviceCard name="Bedroom" model="OrbitCast S" ip="192.168.1.58" status="offline" />
        </div>
      </Section>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
