<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--base-100);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DPad, RotaryKnob, IconButton, AppShortcut } = window.OrbitTVRemoteDesignSystem_08e5b7;

function Demo() {
  const [muted, setMuted] = React.useState(false);
  return (
    <div style={{ display: 'flex', gap: 40, alignItems: 'center', fontFamily: 'var(--font-sans)' }}>
      <DPad size={180} />
      <RotaryKnob
        size={180}
        center={
          <IconButton
            icon={muted ? 'volume_off' : 'volume_up'}
            active={muted}
            size="md"
            aria-label="Mute"
            onClick={() => setMuted((m) => !m)}
          />
        }
      />
      <div style={{ display: 'flex', gap: 16 }}>
        <AppShortcut icon="live_tv" label="Live TV" />
        <AppShortcut icon="movie" label="Movies" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
