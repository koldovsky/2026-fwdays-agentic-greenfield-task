<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:0;background:var(--base-100);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Modal, Input, Button, Toast } = window.OrbitTVRemoteDesignSystem_08e5b7;

function Demo() {
  const [ip, setIp] = React.useState('');
  return (
    <div style={{ position: 'relative', width: 700, height: 520 }}>
      <Modal
        open={true}
        title="Add a TV"
        footer={<Button variant="primary">Connect</Button>}
      >
        <Input label="IP Address" icon="lan" placeholder="192.168.1.42" value={ip} onChange={setIp} />
      </Modal>
      {Toast && (
        <div style={{ position: 'absolute', bottom: 32, right: 32, display: 'flex', flexDirection: 'column', gap: 12 }}>
          <Toast tone="error" onDismiss={() => {}}>
            Can't reach the TV. Check that it's on and on the same network.
          </Toast>
          <Toast tone="warning" onDismiss={() => {}}>
            Your TV doesn't support this action.
          </Toast>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
