<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--base-100);font-family:var(--font-sans);display:flex;gap:14px;}
.sw{width:90px;height:90px;border-radius:16px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;}
</style></head>
<body>
<div class="sw" style="background:var(--base-100);box-shadow:var(--nm-raised-sm);color:var(--fg-2)">base-100</div>
<div class="sw" style="background:var(--base-200);color:var(--fg-2)">base-200</div>
<div class="sw" style="background:var(--base-300);color:var(--fg-1)">base-300</div>
<div style="width:1px;background:var(--hairline);margin:0 4px"></div>
<div class="sw" style="background:var(--base-100);color:var(--fg-1);font-weight:700;box-shadow:none;font-size:20px;align-items:center;justify-content:center">Aa fg-1</div>
<div class="sw" style="background:var(--base-100);color:var(--fg-2);font-weight:700;box-shadow:none;font-size:20px;align-items:center;justify-content:center">Aa fg-2</div>
<div class="sw" style="background:var(--base-100);color:var(--fg-3);font-weight:700;box-shadow:none;font-size:20px;align-items:center;justify-content:center">Aa fg-3</div>
</body></html>
