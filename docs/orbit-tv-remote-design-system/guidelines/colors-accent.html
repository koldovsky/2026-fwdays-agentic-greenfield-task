<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--base-100);font-family:var(--font-sans);display:flex;gap:14px;align-items:flex-end;}
.sw{width:90px;height:90px;border-radius:16px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;box-shadow:var(--nm-raised-sm);}
</style></head>
<body>
<div class="sw" style="background:var(--accent-soft);color:var(--fg-1)">soft</div>
<div class="sw" style="background:var(--accent)">accent</div>
<div class="sw" style="background:var(--accent-strong)">strong</div>
<div class="sw" style="background:var(--accent-wash);color:var(--fg-1);box-shadow:none;border:1px solid var(--hairline)">wash</div>
</body></html>
