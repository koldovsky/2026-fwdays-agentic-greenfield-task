<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--base-100);font-family:var(--font-sans);display:flex;gap:20px;}
.sw{width:110px;height:110px;border-radius:22px;background:var(--base-100);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg-2);}
</style></head>
<body>
<div class="sw" style="box-shadow:var(--nm-raised-sm)">raised sm</div>
<div class="sw" style="box-shadow:var(--nm-raised-md)">raised md</div>
<div class="sw" style="box-shadow:var(--nm-raised-lg)">raised lg</div>
<div class="sw" style="box-shadow:var(--nm-inset-sm)">inset sm</div>
<div class="sw" style="box-shadow:var(--nm-inset-md)">inset md</div>
</body></html>
