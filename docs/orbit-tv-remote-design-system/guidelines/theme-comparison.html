<!-- @dsCard group="Colors" viewport="700x150" name="Light vs Dark Theme" subtitle="Same tokens, [data-theme=dark] override" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:#ccc;font-family:var(--font-sans);display:flex;gap:16px;}
.panel{flex:1;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;}
.btn{align-self:flex-start;padding:9px 18px;border-radius:14px;font-size:13px;font-weight:600;color:var(--fg-on-accent);background:linear-gradient(145deg,var(--accent),var(--accent-strong));box-shadow:var(--nm-raised-accent);}
.card{padding:10px 14px;border-radius:14px;box-shadow:var(--nm-raised-sm);font-size:12px;color:var(--fg-2);}
</style></head>
<body>
<div class="panel" style="background:var(--base-100)">
  <div class="btn">Primary</div>
  <div class="card">Raised card, light</div>
</div>
<div class="panel" data-theme="dark" style="background:var(--base-100)">
  <div class="btn">Primary</div>
  <div class="card">Raised card, dark</div>
</div>
</body></html>
