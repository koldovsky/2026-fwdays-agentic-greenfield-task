<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Orbit TV Remote — UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--base-100); transition: background .25s ease; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="DeviceListScreen.jsx"></script>
<script type="text/babel" src="RemoteScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [dark, setDark] = React.useState(false);
  const [view, setView] = React.useState('list'); // 'list' | 'remote'
  const [activeDevice, setActiveDevice] = React.useState(null);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  if (view === 'remote') {
    return <window.RemoteScreen device={activeDevice} onBack={() => setView('list')} />;
  }
  return (
    <window.DeviceListScreen
      dark={dark}
      onToggleDark={() => setDark((d) => !d)}
      onOpenRemote={(d) => { setActiveDevice(d); setView('remote'); }}
    />
  );
}

// wait for the two screen scripts to register before mounting
function boot() {
  if (window.DeviceListScreen && window.RemoteScreen) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    setTimeout(boot, 20);
  }
}
boot();
</script>
</body>
</html>
