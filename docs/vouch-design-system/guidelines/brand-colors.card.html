<!-- @dsCard group="Colors" viewport="700x162" subtitle="Brand & ink palette" name="Brand Colors" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{padding:16px;background:#fff;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .swatch{border:1px solid #e8eaed;border-radius:10px;overflow:hidden}
    .chip{height:72px}
    .info{padding:8px 10px}
    .name{font-weight:600;font-size:12px;color:#16243d;margin-bottom:2px}
    .hex{font-family:ui-monospace,monospace;font-size:11px;color:#94a0b0}
  </style>
</head>
<body>
  <div class="swatches">
    <div class="swatch"><div class="chip" style="background:#16243d"></div><div class="info"><div class="name">Ink</div><div class="hex">#16243D</div></div></div>
    <div class="swatch"><div class="chip" style="background:#3257c5"></div><div class="info"><div class="name">Brand</div><div class="hex">#3257C5</div></div></div>
    <div class="swatch"><div class="chip" style="background:#eaf0fd"></div><div class="info"><div class="name">Brand wash</div><div class="hex">#EAF0FD</div></div></div>
    <div class="swatch"><div class="chip" style="background:#5a6678"></div><div class="info"><div class="name">Ink soft</div><div class="hex">#5A6678</div></div></div>
    <div class="swatch"><div class="chip" style="background:#94a0b0"></div><div class="info"><div class="name">Muted</div><div class="hex">#94A0B0</div></div></div>
  </div>
</body>
</html>
