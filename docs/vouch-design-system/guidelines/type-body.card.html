<!-- @dsCard group="Type" viewport="700x182" subtitle="Hanken Grotesk — body, UI labels, form fields" name="Body Type" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{padding:20px 24px;background:#fff;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    .row{display:flex;align-items:baseline;gap:20px;margin-bottom:8px;border-bottom:1px solid #f0f1f3;padding-bottom:8px}
    .row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .label{font-family:ui-monospace,monospace;font-size:11px;color:#94a0b0;width:80px;flex-shrink:0}
    .sample{color:#16243d}
  </style>
</head>
<body>
  <div class="row"><span class="label">700 · 18px</span><span class="sample" style="font-weight:700;font-size:18px">Grounded, twice — every claim verified</span></div>
  <div class="row"><span class="label">600 · 16px</span><span class="sample" style="font-weight:600;font-size:16px">Overclaims quarantined until you decide</span></div>
  <div class="row"><span class="label">500 · 15px</span><span class="sample" style="font-weight:500;font-size:15px">Each bullet links back to a real sentence in your CV.</span></div>
  <div class="row"><span class="label">400 · 14px</span><span class="sample" style="font-weight:400;font-size:14px;color:#5a6678">Encrypted at rest, never used for training, deletable in one click.</span></div>
  <div class="row"><span class="label">mono · 12px</span><span class="sample" style="font-family:ui-monospace,monospace;font-size:12px;color:#3257c5;letter-spacing:0.12em;text-transform:uppercase">FR-BULLETS-02 · met · partial · gap</span></div>
</body>
</html>
