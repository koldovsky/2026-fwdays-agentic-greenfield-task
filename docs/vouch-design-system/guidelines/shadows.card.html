<!-- @dsCard group="Spacing" viewport="700x162" subtitle="Elevation and brand-tinted shadow tokens" name="Shadows" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{padding:20px 24px;background:#f4f5f7;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    .row{display:flex;align-items:center;gap:18px}
    .box{width:80px;height:52px;background:#fff;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .info{display:flex;flex-direction:column;gap:2px}
    .token{font-family:ui-monospace,monospace;font-size:11px;color:#3257c5}
    .use{font-size:11px;color:#94a0b0}
  </style>
</head>
<body>
  <div class="row">
    <div><div class="box" style="box-shadow:0 1px 3px rgba(22,36,61,0.08)"></div><div class="info" style="margin-top:6px"><span class="token">--shadow-card</span><span class="use">static cards</span></div></div>
    <div><div class="box" style="box-shadow:0 4px 16px -4px rgba(22,36,61,0.18)"></div><div class="info" style="margin-top:6px"><span class="token">--shadow-lifted</span><span class="use">hover state</span></div></div>
    <div><div class="box" style="box-shadow:0 18px 40px -24px rgba(22,36,61,0.35)"></div><div class="info" style="margin-top:6px"><span class="token">--shadow-float</span><span class="use">hero demo cards</span></div></div>
    <div><div class="box" style="box-shadow:0 2px 8px rgba(50,87,197,0.25);background:#3257c5"></div><div class="info" style="margin-top:6px"><span class="token">--shadow-brand</span><span class="use">primary buttons</span></div></div>
    <div><div class="box" style="box-shadow:0 8px 24px -6px rgba(50,87,197,0.6);background:#3257c5"></div><div class="info" style="margin-top:6px"><span class="token">--shadow-brand-strong</span><span class="use">hero CTA</span></div></div>
  </div>
</body>
</html>
