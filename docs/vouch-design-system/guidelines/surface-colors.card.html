<!-- @dsCard group="Colors" viewport="700x152" subtitle="Surfaces — warm-neutral paper palette" name="Surface Colors" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{padding:16px;background:#eceef0;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .swatch{border:1px solid #dde0e4;border-radius:10px;overflow:hidden}
    .chip{height:64px}
    .info{padding:8px 10px;background:#fff}
    .name{font-weight:600;font-size:12px;color:#16243d;margin-bottom:2px}
    .hex{font-family:ui-monospace,monospace;font-size:11px;color:#94a0b0}
  </style>
</head>
<body>
  <div class="swatches">
    <div class="swatch"><div class="chip" style="background:#fff;border-bottom:1px solid #eee"></div><div class="info"><div class="name">Card</div><div class="hex">#FFFFFF</div></div></div>
    <div class="swatch"><div class="chip" style="background:#f4f5f7"></div><div class="info"><div class="name">Canvas</div><div class="hex">#F4F5F7</div></div></div>
    <div class="swatch"><div class="chip" style="background:#faf7f2"></div><div class="info"><div class="name">Warm tint</div><div class="hex">#FAF7F2</div></div></div>
    <div class="swatch"><div class="chip" style="background:#e3e6ea"></div><div class="info"><div class="name">Hairline</div><div class="hex">#E3E6EA</div></div></div>
    <div class="swatch"><div class="chip" style="background:#16243d"></div><div class="info"><div class="name">Ink surface</div><div class="hex">#16243D</div></div></div>
  </div>
</body>
</html>
