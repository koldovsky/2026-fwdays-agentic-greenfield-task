openapi: 3.1.0
info:
  title: OpenAI API
  version: 2.3.0
paths:
  /audio/speech:
    post:
      operationId: createSpeech
      tags:
        - Audio
      summary: |
        Generates audio from the input text.

        Returns the audio file content, or a stream of audio events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpeechRequest"
      responses:
        "200":
          description: OK
          headers:
            Transfer-Encoding:
              schema:
                type: string
              description: chunked
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/event-stream:
              schema:
                $ref: "#/components/schemas/CreateSpeechResponseStreamEvent"
components:
  schemas:
    CreateSpeechRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          description: >
            One of the available [TTS models](/docs/models#tts): `tts-1`,
            `tts-1-hd`, `gpt-4o-mini-tts`, or `gpt-4o-mini-tts-2025-12-15`.
          anyOf:
            - type: string
            - type: string
              enum:
                - tts-1
                - tts-1-hd
                - gpt-4o-mini-tts
                - gpt-4o-mini-tts-2025-12-15
        input:
          type: string
          description: The text to generate audio for. The maximum length is 4096
            characters.
          maxLength: 4096
        instructions:
          type: string
          description: Control the voice of your generated audio with additional
            instructions. Does not work with `tts-1` or `tts-1-hd`.
          maxLength: 4096
        voice:
          description: 'The voice to use when generating the audio. Supported built-in
            voices are `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`,
            `onyx`, `nova`, `sage`, `shimmer`, `verse`, `marin`, and `cedar`.
            You may also provide a custom voice object with an `id`, for example
            `{ "id": "voice_1234" }`. Previews of the voices are available in
            the [Text to speech
            guide](/docs/guides/text-to-speech#voice-options).'
          $ref: "#/components/schemas/VoiceIdsOrCustomVoice"
        response_format:
          description: The format to audio in. Supported formats are `mp3`, `opus`, `aac`,
            `flac`, `wav`, and `pcm`.
          default: mp3
          type: string
          enum:
            - mp3
            - opus
            - aac
            - flac
            - wav
            - pcm
        speed:
          description: The speed of the generated audio. Select a value from `0.25` to
            `4.0`. `1.0` is the default.
          type: number
          default: 1
          minimum: 0.25
          maximum: 4
        stream_format:
          description: The format to stream the audio in. Supported formats are `sse` and
            `audio`. `sse` is not supported for `tts-1` or `tts-1-hd`.
          type: string
          default: audio
          enum:
            - sse
            - audio
      required:
        - model
        - input
        - voice
    CreateSpeechResponseStreamEvent:
      anyOf:
        - $ref: "#/components/schemas/SpeechAudioDeltaEvent"
        - $ref: "#/components/schemas/SpeechAudioDoneEvent"
      discriminator:
        propertyName: type
    VoiceIdsOrCustomVoice:
      title: Voice
      description: |
        A built-in voice name or a custom voice reference.
      anyOf:
        - $ref: "#/components/schemas/VoiceIdsShared"
        - type: object
          description: Custom voice reference.
          additionalProperties: false
          required:
            - id
          properties:
            id:
              type: string
              description: The custom voice ID, e.g. `voice_1234`.
    SpeechAudioDeltaEvent:
      type: object
      description: Emitted for each chunk of audio data generated during speech synthesis.
      properties:
        type:
          type: string
          description: |
            The type of the event. Always `speech.audio.delta`.
          enum:
            - speech.audio.delta
        audio:
          type: string
          description: |
            A chunk of Base64-encoded audio data.
      required:
        - type
        - audio
    SpeechAudioDoneEvent:
      type: object
      description: Emitted when the speech synthesis is complete and all audio has
        been streamed.
      properties:
        type:
          type: string
          description: |
            The type of the event. Always `speech.audio.done`.
          enum:
            - speech.audio.done
        usage:
          type: object
          description: |
            Token usage statistics for the request.
          properties:
            input_tokens:
              type: integer
              description: Number of input tokens in the prompt.
            output_tokens:
              type: integer
              description: Number of output tokens generated.
            total_tokens:
              type: integer
              description: Total number of tokens used (input + output).
          required:
            - input_tokens
            - output_tokens
            - total_tokens
      required:
        - type
        - usage
    VoiceIdsShared:
      anyOf:
        - type: string
        - type: string
          enum:
            - alloy
            - ash
            - ballad
            - coral
            - echo
            - sage
            - shimmer
            - verse
            - marin
            - cedar
