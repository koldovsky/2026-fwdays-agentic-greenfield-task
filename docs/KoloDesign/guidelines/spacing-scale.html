<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="~4px base; UI 4–16, report 24–44" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:22px;display:flex;gap:14px;align-items:flex-end}
.col{text-align:center}.bar{background:var(--green-tint-2);border:1px solid var(--green-line);border-radius:3px}
.lab{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);margin-top:6px}</style>
</head><body>
<div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="lab">4</div></div>
<div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="lab">8</div></div>
<div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="lab">12</div></div>
<div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="lab">16</div></div>
<div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="lab">24</div></div>
<div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="lab">32</div></div>
<div class="col"><div class="bar" style="width:44px;height:44px"></div><div class="lab">44</div></div>
</body></html>
