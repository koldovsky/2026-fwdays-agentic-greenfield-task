<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Low-chroma badge fills & ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:20px;display:flex;gap:12px;align-items:center}
.badge{padding:4px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:var(--weight-medium)}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);margin-top:6px;text-align:center}
.col{text-align:center}</style>
</head><body>
<div class="col"><span class="badge" style="background:var(--green-tint-4);color:var(--green-ink)">done</span><div class="hex">#EEFAF2 / #1E6B41</div></div>
<div class="col"><span class="badge" style="background:var(--warn-fill);color:var(--warn-ink)">collecting</span><div class="hex">#FEF9EC / #92690E</div></div>
<div class="col"><span class="badge" style="background:var(--danger-fill);color:var(--danger-ink)">declined</span><div class="hex">#FDEEED / #8B2E28</div></div>
<div class="col"><span class="badge" style="background:var(--neutral-fill);color:var(--ink-muted)">draft</span><div class="hex">#F2F2F1 / #5B5A55</div></div>
</body></html>
