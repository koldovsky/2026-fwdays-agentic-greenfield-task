<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Warm paper greyscale — never pure white/black" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--paper);padding:18px;display:flex;gap:10px}
.sw{flex:1;border:1px solid var(--line-soft);border-radius:var(--radius-md);overflow:hidden}
.chip{height:62px}.lab{padding:7px 9px;font-size:11px;color:var(--ink)}.hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted)}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="lab">paper<br><span class="hex">#FAF9F6</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="lab">surface<br><span class="hex">#FFFFFF</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="lab">ink<br><span class="hex">#1A1A18</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ink-muted)"></div><div class="lab">ink-muted<br><span class="hex">#5B5A55</span></div></div>
</body></html>
