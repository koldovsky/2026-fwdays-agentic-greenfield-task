<!-- @dsCard group="Colors" viewport="700x150" name="Brand green" subtitle="One evergreen accent + its tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:18px;display:flex;gap:8px}
.sw{flex:1;text-align:center}
.chip{height:48px;border-radius:var(--radius-sm);border:1px solid var(--line-soft)}
.lab{font-size:10.5px;color:var(--ink);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-muted)}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--green);border-color:var(--green)"></div><div class="lab">green</div><div class="hex">#2E5E4E</div></div>
<div class="sw"><div class="chip" style="background:var(--green-ink);border-color:var(--green-ink)"></div><div class="lab">green-ink</div><div class="hex">#1E6B41</div></div>
<div class="sw"><div class="chip" style="background:var(--green-tint-4)"></div><div class="lab">tint-4</div><div class="hex">#EEFAF2</div></div>
<div class="sw"><div class="chip" style="background:var(--green-tint-2)"></div><div class="lab">tint-2</div><div class="hex">#F0F7F4</div></div>
<div class="sw"><div class="chip" style="background:var(--green-tint-3)"></div><div class="lab">tint-3</div><div class="hex">#EBF4F0</div></div>
<div class="sw"><div class="chip" style="background:var(--green-line)"></div><div class="lab">green-line</div><div class="hex">#B8DDD2</div></div>
</body></html>
