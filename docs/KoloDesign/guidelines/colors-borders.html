<!-- @dsCard group="Colors" viewport="700x150" name="Borders & lines" subtitle="Graded warm-grey hairline ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:18px;display:flex;gap:10px}
.sw{flex:1;text-align:center}
.chip{height:48px;border-radius:var(--radius-sm);background:var(--paper)}
.lab{font-size:11px;color:var(--ink);margin-top:7px}.hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted)}</style>
</head><body>
<div class="sw"><div class="chip" style="border:1px solid var(--line-faint)"></div><div class="lab">faint</div><div class="hex">#F2F1EE</div></div>
<div class="sw"><div class="chip" style="border:1px solid var(--line-soft)"></div><div class="lab">soft</div><div class="hex">#E8E7E3</div></div>
<div class="sw"><div class="chip" style="border:1px solid var(--line)"></div><div class="lab">line</div><div class="hex">#E0DED8</div></div>
<div class="sw"><div class="chip" style="border:1px solid var(--line-strong)"></div><div class="lab">strong</div><div class="hex">#C9C7BF</div></div>
<div class="sw"><div class="chip" style="border:1px solid var(--dot-empty)"></div><div class="lab">dot-empty</div><div class="hex">#DEDCD5</div></div>
</body></html>
