<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:24px;color:var(--ink)}
.row{display:flex;align-items:center;gap:16px;padding:8px 0}
.cap{font-size:12px;color:var(--ink-muted);width:150px}
.track{flex:1;height:4px;background:var(--line);border-radius:2px}
.fill{height:4px;background:var(--green);border-radius:2px}</style>
</head><body>
<div class="row"><span class="cap">5/6 responded</span><div class="track"><div class="fill" style="width:83%"></div></div></div>
<div class="row"><span class="cap">3/3 responded</span><div class="track"><div class="fill" style="width:100%"></div></div></div>
<div class="row"><span class="cap">1/5 responded</span><div class="track"><div class="fill" style="width:20%"></div></div></div>
</body></html>
