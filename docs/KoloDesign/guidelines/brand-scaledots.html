<!-- @dsCard group="Brand" viewport="700x150" name="Scale dots" subtitle="Signature score viz — five 10px dots + numeral" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:24px;color:var(--ink)}
.row{display:flex;align-items:center;gap:14px;padding:7px 0}
.dots{display:flex;gap:7px}.d{width:10px;height:10px;border-radius:50%}
.f{background:var(--ink)}.e{background:var(--dot-empty)}
.score{font-size:13px;color:var(--ink-muted)}.title{font-family:var(--font-serif);font-size:16px;width:200px}</style>
</head><body>
<div class="row"><span class="title">Technical leadership</span><div class="dots"><span class="d f"></span><span class="d f"></span><span class="d f"></span><span class="d f"></span><span class="d f"></span></div><span class="score">4.4 / 5</span></div>
<div class="row"><span class="title">Communication</span><div class="dots"><span class="d f"></span><span class="d f"></span><span class="d f"></span><span class="d f"></span><span class="d e"></span></div><span class="score">4.1 / 5</span></div>
<div class="row"><span class="title">Delivery &amp; execution</span><div class="dots"><span class="d f"></span><span class="d f"></span><span class="d f"></span><span class="d e"></span><span class="d e"></span></div><span class="score">3.8 / 5</span></div>
</body></html>
