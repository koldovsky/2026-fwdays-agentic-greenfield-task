<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & elevation" subtitle="6/8px radii; shadows only on overlays" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--paper);padding:22px;display:flex;gap:18px;align-items:center}
.box{width:84px;height:60px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-muted)}
.lab{font-size:10.5px;color:var(--ink-muted);margin-top:7px;text-align:center}</style>
</head><body>
<div><div class="box" style="border:1px solid var(--line-soft);border-radius:6px">6px</div><div class="lab">chip / control</div></div>
<div><div class="box" style="border:1px solid var(--line-soft);border-radius:8px">8px</div><div class="lab">card / input</div></div>
<div><div class="box" style="border:1px solid var(--line-soft);border-radius:8px;box-shadow:var(--shadow-dialog)">dialog</div><div class="lab">0 8 32 / .12</div></div>
<div><div class="box" style="background:var(--ink);color:var(--paper);border-radius:8px;box-shadow:var(--shadow-toast)">toast</div><div class="lab">0 4 16 / .18</div></div>
</body></html>
