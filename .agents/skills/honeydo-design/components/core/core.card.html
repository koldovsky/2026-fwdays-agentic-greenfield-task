<!-- @dsCard group="Components" viewport="700x440" name="Core" subtitle="Buttons, inputs, chips, tags, switch, segmented, avatar, badge" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  #root { padding: 22px 24px; }
  .grid { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .h { font-family: var(--font-text); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); width: 100%; margin-bottom: -8px; }
  svg { width: 18px; height: 18px; }
</style>
</head>
<body data-theme="dark">
  <div id="root"></div>
  <script type="text/babel">
    const { Button, IconButton, Input, Tag, FilterChip, Card, Badge, Avatar, Switch, SegmentedControl } = window.HoneydoDesignSystem_cfe9be;
    const Ico = ({ n, ...p }) => <i data-lucide={n} {...p}></i>;

    function Demo() {
      const [on, setOn] = React.useState(true);
      const [theme, setTheme] = React.useState("Dark");
      const [sel, setSel] = React.useState("Design");
      return (
        <div className="grid">
          <div className="row"><span className="h">Buttons</span>
            <Button variant="primary" leadingIcon={<Ico n="play" />}>Start</Button>
            <Button variant="secondary">Cancel</Button>
            <Button variant="ghost">Skip</Button>
            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
          <div className="row"><span className="h">Icon buttons · Avatar · Badge</span>
            <IconButton variant="accent" label="play"><Ico n="play" /></IconButton>
            <IconButton variant="soft" label="more"><Ico n="more-horizontal" /></IconButton>
            <IconButton variant="outline" label="plus"><Ico n="plus" /></IconButton>
            <Avatar name="Maya Okonkwo" />
            <Badge tone="accent">3</Badge>
            <Badge tone="success">Goal met</Badge>
            <Badge tone="gold">7</Badge>
          </div>
          <div className="row"><span className="h">Tags · Filter chips</span>
            <Tag color="amber">Design</Tag>
            <Tag color="green">Admin</Tag>
            <Tag color="blue">Meetings</Tag>
            <FilterChip selected={sel==="All"} onClick={()=>setSel("All")}>All</FilterChip>
            <FilterChip dot="#F5A300" selected={sel==="Design"} onClick={()=>setSel("Design")}>Design</FilterChip>
            <FilterChip dot="#7BC57F" selected={sel==="Admin"} onClick={()=>setSel("Admin")}>Admin</FilterChip>
          </div>
          <div className="row"><span className="h">Input</span>
            <Input label="Description" placeholder="What are you working on?" leadingIcon={<Ico n="pencil" />} containerStyle={{ flex: 1, minWidth: 260 }} />
          </div>
          <div className="row"><span className="h">Switch · Segmented control</span>
            <Switch checked={on} onChange={setOn} />
            <SegmentedControl options={["Light","Dark","System"]} value={theme} onChange={setTheme} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
  </script>
</body>
</html>
