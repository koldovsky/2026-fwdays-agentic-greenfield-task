<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4pt base — iOS rhythm, 20px default gutter" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #1C1A17; color: #F4ECDD; font-family: var(--font-text); }
  .wrap { display: flex; align-items: flex-end; gap: 16px; padding: 22px 24px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .bar { background: var(--accent); border-radius: 4px; width: 100%; }
  .v { font-size: 11px; color: #B8A88E; font-variant-numeric: tabular-nums; }
  .n { font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item" style="width:18px"><div class="bar" style="height:8px"></div><span class="n">1</span><span class="v">4</span></div>
    <div class="item" style="width:22px"><div class="bar" style="height:12px"></div><span class="n">3</span><span class="v">12</span></div>
    <div class="item" style="width:26px"><div class="bar" style="height:16px"></div><span class="n">4</span><span class="v">16</span></div>
    <div class="item" style="width:30px"><div class="bar" style="height:24px"></div><span class="n">6</span><span class="v">24</span></div>
    <div class="item" style="width:36px"><div class="bar" style="height:32px"></div><span class="n">7</span><span class="v">32</span></div>
    <div class="item" style="width:42px"><div class="bar" style="height:40px"></div><span class="n">8</span><span class="v">40</span></div>
    <div class="item" style="width:50px"><div class="bar" style="height:56px"></div><span class="n">9</span><span class="v">56</span></div>
  </div>
</body>
</html>
