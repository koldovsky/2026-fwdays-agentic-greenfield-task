<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin:0; padding:20px; background:var(--color-bg); } </style></head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Card, Tabs, Button } = window.NotelyDesignSystem_fd4cb3;
    function Demo(){
      const [tab,setTab]=React.useState("all");
      return (<div style={{display:"flex",flexDirection:"column",gap:16}}>
        <Tabs value={tab} onChange={setTab} tabs={[{value:"all",label:"All notes",count:24},{value:"pinned",label:"Pinned",count:3},{value:"shared",label:"Shared"}]}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Card interactive>
            <div style={{fontSize:15,fontWeight:600,color:"var(--color-text)"}}>Weekly review</div>
            <div style={{fontSize:13,color:"var(--color-text-secondary)",marginTop:6}}>Three wins, one lesson, next focus…</div>
          </Card>
          <Card elevation={2}>
            <div style={{fontSize:15,fontWeight:600,color:"var(--color-text)"}}>Roadmap Q3</div>
            <div style={{fontSize:13,color:"var(--color-text-secondary)",marginTop:6}}>Elevation 2 resting card.</div>
          </Card>
        </div>
        <div><Button>Open dialog</Button></div>
      </div>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    setTimeout(()=>window.lucide && window.lucide.createIcons(), 50);
  </script>
</body></html>
