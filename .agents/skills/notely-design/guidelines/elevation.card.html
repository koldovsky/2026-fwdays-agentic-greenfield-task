<!-- @dsCard group="Brand" viewport="700x150" name="Elevation" subtitle="6 soft shadow levels — 0 flush to 5 overlay" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--color-bg); display:flex; gap:20px; align-items:center; justify-content:space-between; }
  .col { text-align:center; }
  .box { width:74px; height:54px; background:var(--color-card); border-radius:var(--radius-md); border:1px solid var(--color-border); }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-text-secondary); margin-top:10px; }
</style></head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-0)"></div><div class="v">0</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="v">1 card</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="v">2 hover</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="v">3 popover</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-4)"></div><div class="v">4 modal</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-5)"></div><div class="v">5 overlay</div></div>
</body></html>
