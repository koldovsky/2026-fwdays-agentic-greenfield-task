<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Primary" subtitle="Indigo accent — actions, links, selection" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--color-card); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius-md); border:1px solid var(--color-border); }
  .name { font-size:12px; font-weight:600; margin-top:6px; color:var(--color-text); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--color-text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="name">Primary</div><div class="hex">#4F46E5</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-700)"></div><div class="name">Hover</div><div class="hex">#4338CA</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-800)"></div><div class="name">Pressed</div><div class="hex">#3730A3</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-50)"></div><div class="name">Subtle</div><div class="hex">#EEF0FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="name">Secondary</div><div class="hex">#0D9488</div></div>
  </div>
</body></html>
