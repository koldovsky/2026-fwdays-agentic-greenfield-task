<!-- @dsCard group="Spacing" viewport="700x150" name="8px Scale" subtitle="2 · 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--color-card); display:flex; align-items:flex-end; gap:14px; }
  .col { text-align:center; }
  .bar { width:100%; background:var(--color-primary-subtle); border:1px solid var(--indigo-200); border-radius:var(--radius-xs); }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-text-secondary); margin-top:6px; }
</style></head>
<body>
  <div class="col"><div class="bar" style="width:2px;height:2px"></div><div class="v">2</div></div>
  <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="v">4</div></div>
  <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="v">8</div></div>
  <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="v">12</div></div>
  <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="v">16</div></div>
  <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="v">24</div></div>
  <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="v">32</div></div>
  <div class="col"><div class="bar" style="width:48px;height:48px"></div><div class="v">48</div></div>
  <div class="col"><div class="bar" style="width:64px;height:64px"></div><div class="v">64</div></div>
</body></html>
