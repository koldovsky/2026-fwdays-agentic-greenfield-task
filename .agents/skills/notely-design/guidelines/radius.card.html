<!-- @dsCard group="Brand" viewport="700x150" name="Radius" subtitle="xs 4 · sm 6 · md 8 · lg 12 · xl 16 · 2xl 24 · full" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--color-card); display:flex; gap:16px; align-items:center; }
  .col { text-align:center; }
  .box { width:64px; height:64px; background:var(--color-primary-subtle); border:1.5px solid var(--color-primary); }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-text-secondary); margin-top:8px; }
</style></head>
<body>
  <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="v">xs 4</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="v">sm 6</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="v">md 8</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="v">lg 12</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="v">xl 16</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="v">2xl 24</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-full)"></div><div class="v">full</div></div>
</body></html>
