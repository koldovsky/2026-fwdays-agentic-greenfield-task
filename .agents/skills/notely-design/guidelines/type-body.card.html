<!-- @dsCard group="Type" viewport="700x230" name="Body, Label & Code" subtitle="Reading sizes, captions, and mono" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--color-card); }
  .line { display:flex; align-items:baseline; gap:16px; padding:6px 0; border-bottom:1px solid var(--color-divider); }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--color-text-tertiary); width:120px; flex:none; }
  code { background:var(--color-bg); border:1px solid var(--color-border); padding:2px 6px; border-radius:var(--radius-sm); }
</style></head>
<body>
  <div class="line"><span class="meta">Body LG · 17</span><span class="t-body-lg">Capture a thought before it floats away.</span></div>
  <div class="line"><span class="meta">Body · 15</span><span class="t-body">Capture a thought before it floats away.</span></div>
  <div class="line"><span class="meta">Body SM · 13</span><span class="t-body-sm">Capture a thought before it floats away.</span></div>
  <div class="line"><span class="meta">Caption · 12</span><span class="t-caption">Edited 2 min ago · synced</span></div>
  <div class="line"><span class="meta">Label · 13/500</span><span class="t-label">Folder name</span></div>
  <div class="line" style="border:0"><span class="meta">Code · 13 mono</span><span class="t-code"><code>npm i notely</code></span></div>
</body></html>
