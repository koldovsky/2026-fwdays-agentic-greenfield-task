<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger, info" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--color-card); }
  .row { display:flex; gap:12px; }
  .sw { flex:1; }
  .chip { height:48px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:600; }
  .sub { height:14px; border-radius:0 0 var(--radius-md) var(--radius-md); margin-top:-2px; }
  .name { font-size:12px; font-weight:600; margin-top:8px; color:var(--color-text); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--color-text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-success)">Aa</div><div class="sub" style="background:var(--color-success-subtle)"></div><div class="name">Success</div><div class="hex">#15803D</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-warning)">Aa</div><div class="sub" style="background:var(--color-warning-subtle)"></div><div class="name">Warning</div><div class="hex">#B45309</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-danger)">Aa</div><div class="sub" style="background:var(--color-danger-subtle)"></div><div class="name">Danger</div><div class="hex">#B91C1C</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-info)">Aa</div><div class="sub" style="background:var(--color-info-subtle)"></div><div class="name">Info</div><div class="hex">#1D4ED8</div></div>
  </div>
</body></html>
