<!-- @dsCard group="Brand" viewport="700x150" name="Motion & Easing" subtitle="Durations + standard easing — hover to play" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--color-card); }
  .track { display:flex; align-items:center; gap:12px; padding:5px 0; }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--color-text-tertiary); width:128px; flex:none; }
  .rail { flex:1; height:10px; background:var(--color-bg); border-radius:var(--radius-full); position:relative; overflow:hidden; }
  .dot { position:absolute; top:1px; left:1px; width:8px; height:8px; border-radius:50%; background:var(--color-primary); animation:run 2.4s infinite; }
  .t1 .dot { animation-duration:2.4s; animation-timing-function:var(--ease-standard); }
  @keyframes run { 0%{left:1px} 45%{left:calc(100% - 9px)} 55%{left:calc(100% - 9px)} 100%{left:1px} }
</style></head>
<body>
  <div class="track t1"><span class="meta">fast 140ms</span><div class="rail"><div class="dot"></div></div></div>
  <div class="track t1"><span class="meta">base 200ms</span><div class="rail"><div class="dot"></div></div></div>
  <div class="track t1"><span class="meta">slow 320ms</span><div class="rail"><div class="dot"></div></div></div>
  <div class="track" style="border:0"><span class="meta">ease-standard</span><span style="font-size:12px;color:var(--color-text-secondary)">cubic-bezier(0.2, 0, 0, 1)</span></div>
</body></html>
